services:
  - type: web
    name: oimo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    disk:
      name: oimo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: OIMO_HOST
        value: "0.0.0.0"
      - key: OIMO_DATA_DIR
        value: ./data
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
